name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            use_musl: true
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            use_musl: false
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            use_musl: false
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
            use_musl: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            use_musl: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install musl-tools (Linux static build)
        if: matrix.use_musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package archive (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/vie dist/
          cp README.md dist/
          tar -czf vie-${{ github.ref_name }}-${{ matrix.target }}.tar.gz -C dist vie README.md

      - name: Package archive (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/${{ matrix.target }}/release/vie.exe" -Destination "dist/"
          Copy-Item "README.md" -Destination "dist/"
          Compress-Archive -Path "dist/*" -DestinationPath "vie-${{ github.ref_name }}-${{ matrix.target }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vie-${{ matrix.target }}
          path: |
            vie-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            vie-${{ github.ref_name }}-${{ matrix.target }}.zip

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
