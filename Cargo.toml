[package]
name = "vie"
version = "0.14.0"
edition = "2024"

[profile.release]
strip = true
lto = true
codegen-units = 1

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
crossterm = "0.29.0"
image = "0.25.10"
natord = "1.0.9"
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm", "image-defaults"] }
trash = "5.4.0"
